title: Hello, World!
type: go
xp: 10
theory: |
  Every Go program starts in **package `main`** with a function called **`main`**.

  To print text, we import the `fmt` package and call `fmt.Println`:

  ```go
  package main

  import "fmt"

  func main() {
  	fmt.Println("Hi there")
  }
  ```

  `Println` prints its arguments and adds a new line at the end.
task: |
  Write a program that prints exactly:

  ```
  Hello, World!
  ```
hint: |
  Replace the comment with `fmt.Println("Hello, World!")`. Mind the comma and the exclamation mark.
starter: |
  package main

  import "fmt"

  func main() {
  	// print "Hello, World!" here
  }
expected_output: |
  Hello, World!
solution: |
  package main
  
  import "fmt"
  
  func main() {
  	fmt.Println("Hello, World!")
  }
