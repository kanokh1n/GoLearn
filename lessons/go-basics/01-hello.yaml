title: Hello, World!
type: go
xp: 10
theory: |
  Любая программа на Go начинается с **пакета `main`** и функции **`main`**.

  Чтобы вывести текст, импортируем пакет `fmt` и вызываем `fmt.Println`:

  ```go
  package main

  import "fmt"

  func main() {
  	fmt.Println("Hi there")
  }
  ```

  `Println` печатает свои аргументы и в конце переводит строку.
task: |
  Напиши программу, которая выводит ровно:

  ```
  Hello, World!
  ```
hint: |
  Замени комментарий на `fmt.Println("Hello, World!")`. Не забудь запятую и восклицательный знак.
starter: |
  package main

  import "fmt"

  func main() {
  	// выведи здесь "Hello, World!"
  }
expected_output: |
  Hello, World!
solution: |
  package main
  
  import "fmt"
  
  func main() {
  	fmt.Println("Hello, World!")
  }
