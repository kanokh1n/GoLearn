title: Переменные
type: go
xp: 10
theory: |
  Переменная хранит значение. В Go есть два основных способа её объявить:

  ```go
  var age int = 25   // полная форма
  name := "Anna"     // краткая форма: тип выводится сам
  ```

  Краткая форма `:=` работает только внутри функций.

  `fmt.Println` может вывести несколько значений через пробел:

  ```go
  fmt.Println(name, "is", age) // Anna is 25
  ```
task: |
  Создай переменную `language` со значением `"Go"` и переменную `year` со значением `2009`.
  Выведи их так, чтобы получилось:

  ```
  Go was created in 2009
  ```
hint: |
  `fmt.Println(language, "was created in", year)`
starter: |
  package main

  import "fmt"

  func main() {
  	// объяви language и year

  	// выведи их
  }
expected_output: |
  Go was created in 2009
solution: |
  package main
  
  import "fmt"
  
  func main() {
  	language := "Go"
  	year := 2009
  	fmt.Println(language, "was created in", year)
  }
