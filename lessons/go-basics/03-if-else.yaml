title: If / Else
type: go
xp: 10
theory: |
  `if` выполняет код, только если условие истинно. Скобки вокруг условия не нужны, а фигурные скобки обязательны:

  ```go
  if temp > 25 {
  	fmt.Println("hot")
  } else if temp > 10 {
  	fmt.Println("warm")
  } else {
  	fmt.Println("cold")
  }
  ```

  Операторы сравнения: `==`, `!=`, `<`, `<=`, `>`, `>=`. Логические: `&&` (и), `||` (или), `!` (не).
task: |
  Напиши функцию `Grade(score int) string`, которая возвращает:

  - `"A"`, если баллов 90 или больше;
  - `"B"`, если 75–89;
  - `"C"`, если 50–74;
  - `"F"` во всех остальных случаях.

  Функция проверяется тестами, поэтому `main` может выводить что угодно.
hint: |
  Сначала проверяй большие значения: `if score >= 90 { return "A" }`, потом `else if score >= 75` и так далее.
starter: |
  package main

  import "fmt"

  func Grade(score int) string {
  	// твой код здесь
  	return ""
  }

  func main() {
  	fmt.Println(Grade(95), Grade(80), Grade(60), Grade(10))
  }
tests: |
  package main

  import "testing"

  func TestGrade(t *testing.T) {
  	cases := []struct {
  		score int
  		want  string
  	}{
  		{100, "A"}, {90, "A"}, {89, "B"}, {75, "B"},
  		{74, "C"}, {50, "C"}, {49, "F"}, {0, "F"},
  	}
  	for _, c := range cases {
  		if got := Grade(c.score); got != c.want {
  			t.Errorf("Grade(%d) = %q, want %q", c.score, got, c.want)
  		}
  	}
  }
solution: |
  package main
  
  func Grade(score int) string {
  	if score >= 90 {
  		return "A"
  	} else if score >= 75 {
  		return "B"
  	} else if score >= 50 {
  		return "C"
  	}
  	return "F"
  }
  
  func main() {}
