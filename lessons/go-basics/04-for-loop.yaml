title: Цикл for
type: go
xp: 10
theory: |
  В Go есть только одно ключевое слово для циклов: **`for`**. У него три формы:

  ```go
  for i := 0; i < 3; i++ { }   // классический
  for n < 100 { }              // как "while"
  for { }                      // бесконечный, выход через break
  ```

  `break` выходит из цикла, `continue` переходит к следующей итерации.
task: |
  Выведи числа от 1 до 15, каждое с новой строки, но:

  - вместо чисел, кратных 3, выводи `Fizz`;
  - вместо кратных 5 выводи `Buzz`;
  - вместо кратных и 3, и 5 выводи `FizzBuzz`.

  Это знаменитая задача с собеседований **FizzBuzz**.
hint: |
  Используй `%` (остаток от деления): `i%3 == 0` значит, что `i` делится на 3. Первым проверяй `i%15 == 0`.
starter: |
  package main

  import "fmt"

  func main() {
  	for i := 1; i <= 15; i++ {
  		// твой код здесь
  		fmt.Println(i)
  	}
  }
expected_output: |
  1
  2
  Fizz
  4
  Buzz
  Fizz
  7
  8
  Fizz
  Buzz
  11
  Fizz
  13
  14
  FizzBuzz
solution: |
  package main
  
  import "fmt"
  
  func main() {
  	for i := 1; i <= 15; i++ {
  		switch {
  		case i%15 == 0:
  			fmt.Println("FizzBuzz")
  		case i%3 == 0:
  			fmt.Println("Fizz")
  		case i%5 == 0:
  			fmt.Println("Buzz")
  		default:
  			fmt.Println(i)
  		}
  	}
  }
