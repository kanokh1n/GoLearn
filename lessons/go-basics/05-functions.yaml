title: Функции
type: go
xp: 15
theory: |
  У функции есть имя, параметры с типами и тип результата:

  ```go
  func add(a int, b int) int {
  	return a + b
  }
  ```

  Если у параметров один тип, его можно написать один раз: `func add(a, b int) int`.

  Функция может возвращать **несколько значений**. В Go это используется повсюду:

  ```go
  func divmod(a, b int) (int, int) {
  	return a / b, a % b
  }

  q, r := divmod(17, 5) // 3, 2
  ```
task: |
  Напиши `MinMax(nums []int) (int, int)`, которая возвращает наименьшее и наибольшее число непустого слайса.

  Пример: `MinMax([]int{3, -1, 7, 2})` возвращает `-1, 7`.
hint: |
  Начни с `min, max := nums[0], nums[0]`, затем пройди по слайсу через `for _, n := range nums` и обновляй значения.
starter: |
  package main

  import "fmt"

  func MinMax(nums []int) (int, int) {
  	// твой код здесь
  	return 0, 0
  }

  func main() {
  	fmt.Println(MinMax([]int{3, -1, 7, 2}))
  }
tests: |
  package main

  import "testing"

  func TestMinMax(t *testing.T) {
  	cases := []struct {
  		in       []int
  		min, max int
  	}{
  		{[]int{3, -1, 7, 2}, -1, 7},
  		{[]int{5}, 5, 5},
  		{[]int{-3, -8, -1}, -8, -1},
  		{[]int{10, 10, 10}, 10, 10},
  	}
  	for _, c := range cases {
  		min, max := MinMax(c.in)
  		if min != c.min || max != c.max {
  			t.Errorf("MinMax(%v) = %d, %d, want %d, %d", c.in, min, max, c.min, c.max)
  		}
  	}
  }
solution: |
  package main
  
  func MinMax(nums []int) (int, int) {
  	lo, hi := nums[0], nums[0]
  	for _, n := range nums {
  		if n < lo {
  			lo = n
  		}
  		if n > hi {
  			hi = n
  		}
  	}
  	return lo, hi
  }
  
  func main() {}
