title: Functions
type: go
xp: 15
theory: |
  A function has a name, parameters with types and a return type:

  ```go
  func add(a int, b int) int {
  	return a + b
  }
  ```

  Parameters of the same type can share it: `func add(a, b int) int`.

  Functions can return **several values**. This is used everywhere in Go:

  ```go
  func divmod(a, b int) (int, int) {
  	return a / b, a % b
  }

  q, r := divmod(17, 5) // 3, 2
  ```
task: |
  Write `MinMax(nums []int) (int, int)` that returns the smallest and the largest number of a non-empty slice.

  Example: `MinMax([]int{3, -1, 7, 2})` returns `-1, 7`.
hint: |
  Start with `min, max := nums[0], nums[0]`, then loop over the slice with `for _, n := range nums` and update them.
starter: |
  package main

  import "fmt"

  func MinMax(nums []int) (int, int) {
  	// your code here
  	return 0, 0
  }

  func main() {
  	fmt.Println(MinMax([]int{3, -1, 7, 2}))
  }
tests: |
  package main

  import "testing"

  func TestMinMax(t *testing.T) {
  	cases := []struct {
  		in       []int
  		min, max int
  	}{
  		{[]int{3, -1, 7, 2}, -1, 7},
  		{[]int{5}, 5, 5},
  		{[]int{-3, -8, -1}, -8, -1},
  		{[]int{10, 10, 10}, 10, 10},
  	}
  	for _, c := range cases {
  		min, max := MinMax(c.in)
  		if min != c.min || max != c.max {
  			t.Errorf("MinMax(%v) = %d, %d, want %d, %d", c.in, min, max, c.min, c.max)
  		}
  	}
  }
solution: |
  package main
  
  func MinMax(nums []int) (int, int) {
  	lo, hi := nums[0], nums[0]
  	for _, n := range nums {
  		if n < lo {
  			lo = n
  		}
  		if n > hi {
  			hi = n
  		}
  	}
  	return lo, hi
  }
  
  func main() {}
