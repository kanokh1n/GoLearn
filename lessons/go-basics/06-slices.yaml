title: Слайсы
type: go
xp: 15
theory: |
  **Слайс** — это список значений, который может расти:

  ```go
  nums := []int{1, 2, 3}
  nums = append(nums, 4)      // [1 2 3 4]
  fmt.Println(len(nums))      // 4
  fmt.Println(nums[1:3])      // [2 3]
  ```

  По слайсу удобно идти через `range`, он отдаёт индекс и значение:

  ```go
  for i, n := range nums {
  	fmt.Println(i, n)
  }
  ```

  Если индекс не нужен, пиши `_`: `for _, n := range nums`.
task: |
  Напиши `Evens(nums []int) []int`, которая возвращает **новый** слайс только с чётными числами в том же порядке.

  Пример: `Evens([]int{1, 2, 3, 4, 6})` возвращает `[2 4 6]`.
hint: |
  Создай пустой слайс `var result []int` и добавляй через `append` каждое `n`, для которого `n%2 == 0`.
starter: |
  package main

  import "fmt"

  func Evens(nums []int) []int {
  	// твой код здесь
  	return nil
  }

  func main() {
  	fmt.Println(Evens([]int{1, 2, 3, 4, 6}))
  }
tests: |
  package main

  import (
  	"slices"
  	"testing"
  )

  func TestEvens(t *testing.T) {
  	cases := []struct{ in, want []int }{
  		{[]int{1, 2, 3, 4, 6}, []int{2, 4, 6}},
  		{[]int{1, 3, 5}, nil},
  		{[]int{0, -2, 7}, []int{0, -2}},
  	}
  	for _, c := range cases {
  		got := Evens(c.in)
  		if len(got) == 0 && len(c.want) == 0 {
  			continue
  		}
  		if !slices.Equal(got, c.want) {
  			t.Errorf("Evens(%v) = %v, want %v", c.in, got, c.want)
  		}
  	}
  }
solution: |
  package main
  
  func Evens(nums []int) []int {
  	var result []int
  	for _, n := range nums {
  		if n%2 == 0 {
  			result = append(result, n)
  		}
  	}
  	return result
  }
  
  func main() {}
