title: Maps
type: go
xp: 15
theory: |
  A **map** stores key → value pairs:

  ```go
  ages := map[string]int{"Anna": 25}
  ages["Ivan"] = 30          // add or update
  fmt.Println(ages["Anna"])  // 25
  delete(ages, "Ivan")

  age, ok := ages["Petr"]    // ok is false if the key is missing
  ```

  A missing key returns the **zero value** (0 for int), so `counts[word]++` just works.
task: |
  Write `WordCount(text string) map[string]int` that counts how many times each word appears.
  Words are separated by spaces; treat upper and lower case as the same word.

  Example: `WordCount("Go is fun go")` returns `map[fun:1 go:2 is:1]`.
hint: |
  Use `strings.Fields(text)` to split into words and `strings.ToLower(word)` to normalize. Don't forget to import `strings`.
starter: |
  package main

  import (
  	"fmt"
  )

  func WordCount(text string) map[string]int {
  	// your code here
  	return nil
  }

  func main() {
  	fmt.Println(WordCount("Go is fun go"))
  }
tests: |
  package main

  import (
  	"maps"
  	"testing"
  )

  func TestWordCount(t *testing.T) {
  	cases := []struct {
  		in   string
  		want map[string]int
  	}{
  		{"Go is fun go", map[string]int{"go": 2, "is": 1, "fun": 1}},
  		{"a  a A b", map[string]int{"a": 3, "b": 1}},
  		{"", map[string]int{}},
  	}
  	for _, c := range cases {
  		got := WordCount(c.in)
  		if len(got) == 0 && len(c.want) == 0 {
  			continue
  		}
  		if !maps.Equal(got, c.want) {
  			t.Errorf("WordCount(%q) = %v, want %v", c.in, got, c.want)
  		}
  	}
  }
solution: |
  package main
  
  import "strings"
  
  func WordCount(text string) map[string]int {
  	counts := map[string]int{}
  	for _, w := range strings.Fields(text) {
  		counts[strings.ToLower(w)]++
  	}
  	return counts
  }
  
  func main() {}
