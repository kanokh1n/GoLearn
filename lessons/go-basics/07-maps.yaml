title: Мапы
type: go
xp: 15
theory: |
  **Мапа** (map) хранит пары ключ → значение:

  ```go
  ages := map[string]int{"Anna": 25}
  ages["Ivan"] = 30          // добавить или обновить
  fmt.Println(ages["Anna"])  // 25
  delete(ages, "Ivan")

  age, ok := ages["Petr"]    // ok == false, если ключа нет
  ```

  Для отсутствующего ключа возвращается **нулевое значение** (0 для int), поэтому `counts[word]++` просто работает.
task: |
  Напиши `WordCount(text string) map[string]int`, которая считает, сколько раз встречается каждое слово.
  Слова разделены пробелами; заглавные и строчные буквы считаются одинаковыми.

  Пример: `WordCount("Go is fun go")` возвращает `map[fun:1 go:2 is:1]`.
hint: |
  `strings.Fields(text)` разбивает текст на слова, а `strings.ToLower(word)` приводит слово к нижнему регистру. Не забудь импортировать `strings`.
starter: |
  package main

  import (
  	"fmt"
  )

  func WordCount(text string) map[string]int {
  	// твой код здесь
  	return nil
  }

  func main() {
  	fmt.Println(WordCount("Go is fun go"))
  }
tests: |
  package main

  import (
  	"maps"
  	"testing"
  )

  func TestWordCount(t *testing.T) {
  	cases := []struct {
  		in   string
  		want map[string]int
  	}{
  		{"Go is fun go", map[string]int{"go": 2, "is": 1, "fun": 1}},
  		{"a  a A b", map[string]int{"a": 3, "b": 1}},
  		{"", map[string]int{}},
  	}
  	for _, c := range cases {
  		got := WordCount(c.in)
  		if len(got) == 0 && len(c.want) == 0 {
  			continue
  		}
  		if !maps.Equal(got, c.want) {
  			t.Errorf("WordCount(%q) = %v, want %v", c.in, got, c.want)
  		}
  	}
  }
solution: |
  package main
  
  import "strings"
  
  func WordCount(text string) map[string]int {
  	counts := map[string]int{}
  	for _, w := range strings.Fields(text) {
  		counts[strings.ToLower(w)]++
  	}
  	return counts
  }
  
  func main() {}
