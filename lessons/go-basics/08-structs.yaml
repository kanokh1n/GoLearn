title: Структуры и методы
type: go
xp: 20
theory: |
  **Структура** объединяет связанные поля:

  ```go
  type User struct {
  	Name string
  	Age  int
  }

  u := User{Name: "Anna", Age: 25}
  fmt.Println(u.Name)
  ```

  **Метод** — это функция, привязанная к типу:

  ```go
  func (u User) Greeting() string {
  	return "Hi, " + u.Name
  }
  ```

  Чтобы метод мог **изменить** структуру, нужен **pointer receiver** (получатель-указатель):

  ```go
  func (u *User) Birthday() {
  	u.Age++
  }
  ```
task: |
  Создай тип `Account` с полем `Balance int` и двумя методами:

  - `Deposit(amount int)` — пополняет баланс;
  - `Withdraw(amount int) bool` — снимает деньги, только если их хватает. Возвращает `true` при успехе и `false` иначе (баланс при этом не меняется).
hint: |
  Оба метода меняют баланс, поэтому используй получатель-указатель: `func (a *Account) Deposit(amount int)`.
starter: |
  package main

  import "fmt"

  type Account struct {
  	// твои поля
  }

  // твои методы

  func main() {
  	acc := &Account{}
  	acc.Deposit(100)
  	fmt.Println(acc.Withdraw(30), acc.Balance)
  }
tests: |
  package main

  import "testing"

  func TestAccount(t *testing.T) {
  	a := &Account{}
  	a.Deposit(100)
  	if a.Balance != 100 {
  		t.Fatalf("after Deposit(100) balance = %d, want 100", a.Balance)
  	}
  	if !a.Withdraw(30) {
  		t.Fatal("Withdraw(30) = false, want true")
  	}
  	if a.Balance != 70 {
  		t.Fatalf("after Withdraw(30) balance = %d, want 70", a.Balance)
  	}
  	if a.Withdraw(100) {
  		t.Fatal("Withdraw(100) with balance 70 = true, want false")
  	}
  	if a.Balance != 70 {
  		t.Fatalf("failed Withdraw changed balance to %d, want 70", a.Balance)
  	}
  }
solution: |
  package main
  
  type Account struct {
  	Balance int
  }
  
  func (a *Account) Deposit(amount int) {
  	a.Balance += amount
  }
  
  func (a *Account) Withdraw(amount int) bool {
  	if amount > a.Balance {
  		return false
  	}
  	a.Balance -= amount
  	return true
  }
  
  func main() {}
