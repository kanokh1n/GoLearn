title: "Проект: REST API задач"
type: go
xp: 50
theory: |
  Соберём всё вместе: маленький REST API для списка задач с хранением в памяти.

  | Метод и путь | Что делает | Ответ |
  |--------------|------------|-------|
  | `POST /tasks` | создать задачу из `{"title": "..."}` | **201** и созданная задача |
  | `GET /tasks` | список всех задач | **200** и JSON-массив |
  | `GET /tasks/{id}` | одна задача | **200** или **404** |

  Задача в JSON: `{"id": 1, "title": "Buy milk", "done": false}`. ID выдаются по порядку с 1.

  Хранилище будет вызываться из разных запросов одновременно, поэтому защити его `sync.Mutex`. ID из пути переводится в число через `strconv.Atoi`.
task: |
  Допиши `newServer() http.Handler`, чтобы API работал по таблице выше. Дополнительно:

  - пустой `title` или некорректный JSON при создании → **400**;
  - `GET /tasks`, когда задач нет, возвращает пустой массив `[]`, а не `null`;
  - нечисловой или несуществующий id → **404**.
hint: |
  Храни задачи в `[]Task` (или `map[int]Task`) внутри структуры с `mu sync.Mutex` и счётчиком `nextID`. Для пустого списка инициализируй слайс: `tasks := []Task{}`. Ответ 201: `w.WriteHeader(http.StatusCreated)` после установки заголовка и до `Encode`.
