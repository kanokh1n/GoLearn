title: SELECT *
type: sql
xp: 10
theory: |
  **SQL** — язык для работы с реляционными базами данных. Данные хранятся в **таблицах** из строк и столбцов.

  Самый простой запрос читает из таблицы всё:

  ```sql
  SELECT * FROM departments;
  ```

  `*` означает «все столбцы». Посмотри на таблицы на этой странице: именно к этим данным выполняются твои запросы.
task: |
  Выбери **все столбцы** **всех сотрудников**.
hint: |
  `SELECT * FROM employees;`
starter: |
  -- напиши запрос здесь
solution: SELECT * FROM employees;
