title: Выбор столбцов
type: sql
xp: 10
theory: |
  Вместо `*` можно перечислить нужные столбцы через запятую:

  ```sql
  SELECT name, city FROM departments;
  ```

  Столбец в результате можно переименовать через `AS`:

  ```sql
  SELECT name AS department FROM departments;
  ```
task: |
  Выбери только `name` и `salary` каждого сотрудника.
hint: |
  `SELECT name, salary FROM ...`
starter: |
  SELECT
solution: SELECT name, salary FROM employees;
