title: Фильтрация через WHERE
type: sql
xp: 10
theory: |
  `WHERE` оставляет только строки, которые подходят под условие:

  ```sql
  SELECT * FROM departments WHERE city = 'Moscow';
  ```

  Операторы: `=`, `<>` (не равно), `<`, `>`, `<=`, `>=`. Текстовые значения пишутся в **одинарных кавычках**.
task: |
  Найди `name` и `salary` сотрудников, которые получают **больше 200000**.
hint: |
  `WHERE salary > 200000`
starter: |
  SELECT name, salary
  FROM employees
solution: SELECT name, salary FROM employees WHERE salary > 200000;
