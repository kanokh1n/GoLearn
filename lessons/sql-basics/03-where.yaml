title: Filtering with WHERE
type: sql
xp: 10
theory: |
  `WHERE` keeps only the rows that match a condition:

  ```sql
  SELECT * FROM departments WHERE city = 'Moscow';
  ```

  Operators: `=`, `<>` (not equal), `<`, `>`, `<=`, `>=`. Text values go in **single quotes**.
task: |
  Find the `name` and `salary` of employees who earn **more than 200000**.
hint: |
  `WHERE salary > 200000`
starter: |
  SELECT name, salary
  FROM employees
solution: SELECT name, salary FROM employees WHERE salary > 200000;
