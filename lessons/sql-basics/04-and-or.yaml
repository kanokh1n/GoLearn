title: AND, OR, IN, BETWEEN
type: sql
xp: 15
theory: |
  Combine conditions with `AND` and `OR`:

  ```sql
  SELECT * FROM employees WHERE department_id = 1 AND hire_year >= 2020;
  ```

  Handy shortcuts:

  ```sql
  WHERE department_id IN (2, 3)        -- same as = 2 OR = 3
  WHERE salary BETWEEN 100000 AND 150000  -- inclusive
  WHERE department_id IS NULL          -- NULL is checked with IS, not =
  ```
task: |
  Find the `name` of employees from departments **2 or 3** who were hired **in 2020 or later**.
hint: |
  `WHERE department_id IN (2, 3) AND hire_year >= 2020`
starter: |
  SELECT name
  FROM employees
solution: SELECT name FROM employees WHERE department_id IN (2, 3) AND hire_year >= 2020;
