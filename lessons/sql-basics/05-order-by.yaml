title: ORDER BY и LIMIT
type: sql
xp: 15
ordered: true
theory: |
  Без сортировки строки возвращаются в произвольном порядке:

  ```sql
  SELECT name, salary FROM employees ORDER BY salary;       -- по возрастанию
  SELECT name, salary FROM employees ORDER BY salary DESC;  -- по убыванию
  ```

  `LIMIT n` оставляет только первые `n` строк:

  ```sql
  SELECT name FROM employees ORDER BY hire_year LIMIT 1;  -- самый первый сотрудник
  ```

  **В этом уроке порядок строк важен.**
task: |
  Покажи `name` и `salary` **трёх самых высокооплачиваемых** сотрудников, от большей зарплаты к меньшей.
hint: |
  `ORDER BY salary DESC LIMIT 3`
starter: |
  SELECT name, salary
  FROM employees
solution: SELECT name, salary FROM employees ORDER BY salary DESC LIMIT 3;
