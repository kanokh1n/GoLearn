title: DISTINCT
type: sql
xp: 10
theory: |
  `DISTINCT` убирает повторяющиеся строки из результата:

  ```sql
  SELECT DISTINCT hire_year FROM employees;
  ```
task: |
  Получи список **уникальных городов**, в которых находятся отделы.
hint: |
  `SELECT DISTINCT city FROM departments;`
starter: |
  SELECT
solution: SELECT DISTINCT city FROM departments;
