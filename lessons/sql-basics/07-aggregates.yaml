title: Агрегатные функции
type: sql
xp: 15
theory: |
  Агрегатные функции превращают много строк в одно значение:

  | Функция | Результат |
  |---------|-----------|
  | `COUNT(*)` | количество строк |
  | `SUM(x)` | сумма |
  | `AVG(x)` | среднее |
  | `MIN(x)`, `MAX(x)` | минимум, максимум |

  ```sql
  SELECT COUNT(*) FROM employees WHERE hire_year = 2022;
  ```
task: |
  **Одним запросом** верни три значения по всем сотрудникам: **количество** сотрудников, **минимальную** и **максимальную** зарплату (в этом порядке).
hint: |
  `SELECT COUNT(*), MIN(salary), MAX(salary) FROM employees;`
starter: |
  SELECT
solution: SELECT COUNT(*), MIN(salary), MAX(salary) FROM employees;
