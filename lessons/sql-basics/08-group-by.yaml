title: GROUP BY
type: sql
xp: 20
theory: |
  `GROUP BY` разбивает строки на группы и применяет агрегатную функцию **к каждой группе**:

  ```sql
  SELECT hire_year, COUNT(*)
  FROM employees
  GROUP BY hire_year;
  ```

  Получится по одной строке на каждый год с количеством сотрудников, нанятых в этот год.

  Правило: каждый столбец в `SELECT` должен быть либо в `GROUP BY`, либо внутри агрегатной функции.
task: |
  Для каждого `department_id` покажи номер отдела и **среднюю зарплату** его сотрудников.
  (Сотрудники без отдела попадут в отдельную группу, это нормально.)
hint: |
  `SELECT department_id, AVG(salary) FROM employees GROUP BY department_id;`
starter: |
  SELECT department_id,
  FROM employees
solution: SELECT department_id, AVG(salary) FROM employees GROUP BY department_id;
