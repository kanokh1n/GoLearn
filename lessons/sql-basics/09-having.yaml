title: HAVING
type: sql
xp: 20
theory: |
  `WHERE` фильтрует **строки до** группировки. `HAVING` фильтрует **группы после** группировки:

  ```sql
  SELECT department_id, COUNT(*)
  FROM employees
  GROUP BY department_id
  HAVING COUNT(*) > 2;
  ```

  Порядок частей запроса: `SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT …`
task: |
  Покажи `department_id` и **общую сумму зарплат** (`SUM`) отделов, у которых эта сумма **больше 400000**.
hint: |
  `GROUP BY department_id HAVING SUM(salary) > 400000`
starter: |
  SELECT department_id, SUM(salary)
  FROM employees
solution: SELECT department_id, SUM(salary) FROM employees GROUP BY department_id HAVING SUM(salary) > 400000;
