title: INNER JOIN
type: sql
xp: 20
theory: |
  Данные часто разнесены по разным таблицам. `employees.department_id` ссылается на `departments.id`.
  **JOIN** соединяет строки двух таблиц:

  ```sql
  SELECT e.name, d.name
  FROM employees e
  JOIN departments d ON d.id = e.department_id;
  ```

  `e` и `d` — короткие **псевдонимы** (алиасы). `INNER JOIN` (или просто `JOIN`) оставляет только строки, у которых есть пара в **обеих** таблицах, поэтому Alex (без отдела) пропадёт.
task: |
  Покажи `name` каждого сотрудника и `city`, в котором находится его отдел.
hint: |
  Соедини `employees` и `departments` по условию `departments.id = employees.department_id` и выбери `e.name, d.city`.
starter: |
  SELECT
  FROM employees e
solution: SELECT e.name, d.city FROM employees e JOIN departments d ON d.id = e.department_id;
