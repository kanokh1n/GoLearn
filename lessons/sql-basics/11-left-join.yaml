title: LEFT JOIN
type: sql
xp: 25
theory: |
  `LEFT JOIN` сохраняет **все** строки левой таблицы, даже если пары для них нет. Недостающие значения справа становятся `NULL`:

  ```sql
  SELECT d.name, e.name
  FROM departments d
  LEFT JOIN employees e ON e.department_id = d.id;
  ```

  В отделе Support нет сотрудников, поэтому он появится с `NULL`.

  Обрати внимание: `COUNT(e.id)` считает только значения, отличные от NULL, а `COUNT(*)` считает все строки.
task: |
  Для **каждого** отдела покажи его `name` и **количество сотрудников**. У отделов без сотрудников должен быть `0`.
hint: |
  `LEFT JOIN employees e ON e.department_id = d.id`, затем `GROUP BY d.id, d.name` и `COUNT(e.id)`.
starter: |
  SELECT d.name,
  FROM departments d
solution: |
  SELECT d.name, COUNT(e.id)
  FROM departments d
  LEFT JOIN employees e ON e.department_id = d.id
  GROUP BY d.id, d.name;
