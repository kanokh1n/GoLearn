title: LEFT JOIN
type: sql
xp: 25
theory: |
  `LEFT JOIN` keeps **all** rows from the left table, even without a match. Missing values on the right become `NULL`:

  ```sql
  SELECT d.name, e.name
  FROM departments d
  LEFT JOIN employees e ON e.department_id = d.id;
  ```

  The Support department has no employees, so it appears with `NULL`.

  Note: `COUNT(e.id)` counts only non-NULL values, while `COUNT(*)` counts all rows.
task: |
  For **every** department show its `name` and the **number of employees** in it. Departments without employees must show `0`.
hint: |
  `LEFT JOIN employees e ON e.department_id = d.id`, then `GROUP BY d.id, d.name` and `COUNT(e.id)`.
starter: |
  SELECT d.name,
  FROM departments d
solution: |
  SELECT d.name, COUNT(e.id)
  FROM departments d
  LEFT JOIN employees e ON e.department_id = d.id
  GROUP BY d.id, d.name;
