title: Подзапросы
type: sql
xp: 25
theory: |
  **Подзапрос** — это запрос внутри другого запроса. Он может вернуть одно значение:

  ```sql
  SELECT name FROM employees
  WHERE hire_year = (SELECT MIN(hire_year) FROM employees);
  ```

  или список для `IN`:

  ```sql
  SELECT name FROM employees
  WHERE department_id IN (SELECT id FROM departments WHERE city = 'Moscow');
  ```
task: |
  Найди `name` и `salary` сотрудников, которые получают **больше средней зарплаты** по всем сотрудникам.
hint: |
  `WHERE salary > (SELECT AVG(salary) FROM employees)`
starter: |
  SELECT name, salary
  FROM employees
solution: SELECT name, salary FROM employees WHERE salary > (SELECT AVG(salary) FROM employees);
