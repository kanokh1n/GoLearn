title: Основы SQL
description: Пишем запросы к небольшой базе компании, от SELECT до JOIN и подзапросов.
order: 4
setup: |
  CREATE TABLE departments (
    id   INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    city TEXT NOT NULL
  );
  INSERT INTO departments VALUES
    (1, 'Engineering', 'Moscow'),
    (2, 'Marketing',   'Kazan'),
    (3, 'Sales',       'Moscow'),
    (4, 'Support',     'Novosibirsk');

  CREATE TABLE employees (
    id            INTEGER PRIMARY KEY,
    name          TEXT NOT NULL,
    department_id INTEGER REFERENCES departments(id),
    salary        INTEGER NOT NULL,
    hire_year     INTEGER NOT NULL
  );
